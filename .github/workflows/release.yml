name: Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish built VSIX files to the Visual Studio Marketplace.
        required: true
        type: boolean
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            os: macos-15
          - target: darwin-x64
            os: macos-15-intel
          - target: linux-x64
            os: ubuntu-latest
          - target: linux-arm64
            os: ubuntu-24.04-arm
          - target: win32-x64
            os: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install npm dependencies
        run: npm ci

      - name: Package ${{ matrix.target }}
        run: node scripts/build-server.js --package ${{ matrix.target }}

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: vsix-${{ matrix.target }}
          path: dist/*.vsix
          if-no-files-found: error

  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' || github.event.inputs.publish == 'true'
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Download VSIX artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: vsix-*
          path: dist
          merge-multiple: true

      - name: Verify marketplace token
        shell: bash
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "VSCE_PAT secret is required to publish."
            exit 1
          fi

      - name: Publish VSIX files
        shell: bash
        run: |
          shopt -s nullglob
          files=(dist/*.vsix)

          if [ ${#files[@]} -eq 0 ]; then
            echo "No VSIX files found to publish."
            exit 1
          fi

          for file in "${files[@]}"; do
            npx --no-install vsce publish --packagePath "$file"
          done
